skills:
  - skill: implement_new_feature
    description: >
      Add a new business feature end-to-end following the project's clean
      architecture: domain model → repository interface + params structs →
      postgres implementation → service interface + serviceImpl → Gin handler
      → route registration in app.go.
    instructions: |
      1. DOMAIN MODEL
         - Add or extend a struct in `internal/domain/<entity>.go`.
         - Keep domain structs pure: no db tags, no JSON tags (those belong to the handler or params).

      2. ERRORS
         - Create or update `internal/<package>/errors.go`.
         - Use `&common.BusinessError{Code: <HTTP status>, Message: "<message>"}` for every domain-level error.
         - Export each error as a named var: `var ErrXxx = &common.BusinessError{...}`.

      3. REPOSITORY INTERFACE + PARAMS
         - Define the interface in `internal/<package>/<entity>_repository.go`.
         - Put Params structs (e.g. `CreateXxxParams`, `UpdateXxxParams`) in the same file.
         - Use pointer fields (`*string`, `*uuid.UUID`) for optional/partial-update fields.
         - Always include `ctx context.Context` as the first parameter.

      4. POSTGRES IMPLEMENTATION
         - Create `internal/<package>/postgres_<entity>_repository.go`.
         - Use `pgxpool.Pool` via the existing `postgrePlatform.NewPostgreSQLConnFromURL`.
         - Map `pgx.ErrNoRows` → the package-local `ErrXxxNotFound` sentinel.
         - Do not leak raw DB errors; wrap only when you need to add context.

      5. SERVICE INTERFACE + IMPL
         - Define `Service` interface and `serviceImpl` struct in `internal/<package>/<entity>_service.go`.
         - Constructor: `func NewService(repo XxxRepository, ...) Service`.
         - Business rules (auth checks, validation, cross-repo consistency) live here, never in the handler.
         - Authorization guard pattern:
           ```go
           isOwner, err := s.IsXxxOwner(ctx, id, requesterID)
           if err != nil { return err }
           if !isOwner { return ErrNotXxxOwner }
           ```

      6. GIN HANDLER
         - Create `internal/<package>/handler.go` with a `Handler` struct holding service dependencies.
         - Constructor: `func NewHandler(svc Service, ...) *Handler`.
         - Every handler method follows this exact shape:
           a. Extract auth user ID: `id, ok := webHelpers.GetAuthUserID(c); if !ok { return }`
           b. Parse path params: `entityID, ok := webHelpers.GetValidatedXxxID(c); if !ok { return }`
           c. Bind JSON body: `if err := c.ShouldBindJSON(&req); err != nil { handler.handleError(c, common.ErrInvalidRequest); return }`
           d. Call service.
           e. On error: `handler.handleError(c, err); return`
           f. On success: `c.JSON(http.StatusOK, webHelpers.OKResponse{Message: "..."})`
              or `c.JSON(http.StatusCreated, entity)` for creation.
         - Add a private `handleError` delegation:
           ```go
           func (h *Handler) handleError(c *gin.Context, err error) {
               webHelpers.HandleError(c, err)
           }
           ```
         - Add Swagger annotations above every exported method (`@Summary`, `@Tags`, `@Success`, `@Failure`, `@Security BearerAuth`, `@Router`).

      7. ROUTE REGISTRATION (app.go)
         - In `NewHTTPServer`, instantiate the handler and wire its routes.
         - Routes that use `:id` path params must be grouped under a subgroup that applies the validation middleware (e.g. `groupMiddleware.ValidateXxxExists()`).
         - Inject the handler's dependencies via the `Dependencies` struct:
           ```go
           deps.XxxRepo = xxx.NewPostgresRepository(db)
           deps.XxxService = xxx.NewService(deps.XxxRepo, ...)
           ```

      8. MOCK GENERATION
         - After defining new interfaces run:
           `mockery --name=XxxRepository --dir=internal/<package> --output=mocks --outpkg=mocks`
         - Confirm the generated mock appears in `mocks/` before writing tests.

  - skill: write_service_unit_tests
    description: >
      Write unit tests for a service layer using testify/mock mocks, following
      the table-driven, env-struct pattern used throughout the project.
    instructions: |
      1. Create the test file as `internal/<package>/<entity>_service_test.go`
         using `package <package>_test` (black-box test package).

      2. Define a `testEnv` struct that holds the mock repositories and the live
         service under test:
         ```go
         type testEnv struct {
             XxxRepository *mocks.XxxRepository
             Service       xxx.Service
         }
         ```

      3. Write a `setupTest()` factory that wires fresh mocks into `NewService`:
         ```go
         func setupTest() *testEnv {
             mockRepo := new(mocks.XxxRepository)
             return &testEnv{
                 XxxRepository: mockRepo,
                 Service:       xxx.NewService(mockRepo),
             }
         }
         ```

      4. For each exported service method write a `TestXxx(t *testing.T)` function.
         Group happy-path and all error branches as sub-tests:
         ```go
         func TestCreateXxx(t *testing.T) {
             t.Run("success", func(t *testing.T) { ... })
             t.Run("fail: <reason>", func(t *testing.T) { ... })
         }
         ```

      5. Sub-test pattern:
         a. Call `setupTest()`.
         b. Set up mock expectations with `.On(...).Return(...).Once()`.
         c. Call the service method with `context.Background()`.
         d. Assert with `assert.NoError` / `assert.Error` / `assert.Equal` / `assert.Nil`.
         e. Always call `env.XxxRepository.AssertExpectations(t)` at the end.

      6. Cover these branches at minimum:
         - Happy path (returns correct data, no error).
         - Input validation failure (no mock calls expected).
         - Authorization failure (requester is not owner / not member).
         - Repository returns not-found error.
         - Repository returns generic DB error.

      7. Run tests with:
         ```
         cd <service-dir>
         go test ./internal/<package>/... -v -run TestXxx
         ```

  - skill: add_database_migration
    description: >
      Add a new SQL migration following the project's sequential numbering
      convention used by golang-migrate.
    instructions: |
      1. Determine the next migration number by listing `migration/` and
         incrementing the highest `NNNNNN` prefix.

      2. Create two files:
         - `migration/<NNNNNN>_<snake_case_description>.up.sql`
         - `migration/<NNNNNN>_<snake_case_description>.down.sql`

      3. The `.up.sql` must be idempotent where possible:
         - Use `CREATE TABLE IF NOT EXISTS`.
         - Use `ALTER TABLE ... ADD COLUMN IF NOT EXISTS`.
         - Use named constraints so they can be dropped by name in `.down.sql`.

      4. The `.down.sql` must fully reverse the `.up.sql` (drop tables, drop
         columns, drop constraints, restore previous state).

      5. For new tables follow the existing schema conventions:
         - Primary key: `id UUID PRIMARY KEY DEFAULT gen_random_uuid()`.
         - Timestamps: `created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()` and, if needed,
           `updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()`.
         - Foreign keys reference `users(id)` or `groups(id)` with `ON DELETE CASCADE`
           when the child record has no meaning without the parent.

      6. After writing the files, apply the migration:
         ```
         migrate -path migration -database "$DATABASE_URL" up
         ```
         and roll it back to verify the down script:
         ```
         migrate -path migration -database "$DATABASE_URL" down 1
         ```

  - skill: add_domain_error
    description: >
      Add a new typed domain error for a package, following the project's
      BusinessError pattern so it is automatically rendered by HandleError.
    instructions: |
      1. Open (or create) `internal/<package>/errors.go`.

      2. Import `"<module>/internal/common"`.

      3. Add the new sentinel inside the existing `var (...)` block:
         ```go
         ErrXxxNotFound = &common.BusinessError{Code: 404, Message: "xxx not found"}
         ```
         Use HTTP status codes that match the semantic:
         - 400 Bad Request  – validation / malformed input
         - 401 Unauthorized – missing / invalid auth
         - 403 Forbidden    – authenticated but not authorized
         - 404 Not Found    – resource absent
         - 409 Conflict     – uniqueness violation

      4. Reference the error from the service and let `webHelpers.HandleError`
         convert it to the correct HTTP response automatically. Never call
         `c.JSON` with raw errors in handlers.

  - skill: debug_request_flow
    description: >
      Trace a failing HTTP request end-to-end through the HealthMate service
      layers to identify where it breaks.
    instructions: |
      1. IDENTIFY THE ENTRY POINT
         - Find the route in `app/app.go` (`NewHTTPServer`).
         - Note which middleware runs before the handler (auth middleware,
           group/member validation middleware).

      2. HANDLER LAYER
         - Confirm `webHelpers.GetAuthUserID(c)` succeeds and extracts the right user.
         - Confirm path param helpers (`GetValidatedGroupID`, `GetValidatedMemberID`, etc.)
           return `ok = true`.
         - Confirm `c.ShouldBindJSON` parses the body without error.

      3. SERVICE LAYER
         - Check each guard: ownership check, existence check, business rule.
         - Look for early-return errors that might swallow the real cause.

      4. REPOSITORY LAYER
         - Confirm the SQL query parameters match the expected values (log or
           add temporary `fmt.Printf` if needed).
         - Check if `pgx.ErrNoRows` is being mapped to the correct sentinel or
           propagated as-is.

      5. ERROR RENDERING
         - Confirm the error returned from the service is a `*common.BusinessError`.
         - If it is not, `webHelpers.HandleError` will return a generic 500 —
           wrap it appropriately.

      6. Reproduce with a minimal curl command that isolates the failing scenario.
         Use `-v` for full request/response headers. Obtain a token via the
         `/auth/app` or `/auth/google` endpoint first, then call the failing route
         with `Authorization: Bearer <token>`.

  - skill: add_new_service_module
    description: >
      Bootstrap a complete new internal service module (e.g. `notification`,
      `audit`) following the established package layout.
    instructions: |
      1. Create the directory `internal/<module>/`.

      2. Create these files in order:
         a. `errors.go`          – package-local BusinessError sentinels.
         b. `<entity>.go`        – repository interface + Params structs.
         c. `postgres_<entity>_repository.go` – pgx implementation.
         d. `<entity>_service.go` – Service interface + serviceImpl.
         e. `handler.go`         – Gin Handler struct + methods.

      3. Wire into `app/app.go`:
         a. Add repo and service fields to `Dependencies`.
         b. Instantiate in `NewDependencies`.
         c. Register HTTP routes in `NewHTTPServer`.

      4. Generate mocks for the new interfaces:
         ```
         mockery --name=<Entity>Repository --dir=internal/<module> --output=mocks --outpkg=mocks
         mockery --name=Service --dir=internal/<module> --output=mocks --outpkg=mocks --filename=<Module>Service.go
         ```

      5. Write unit tests following the `write_service_unit_tests` skill.

      6. Add a migration if the module needs new tables (see `add_database_migration`).

  - skill: register_new_route
    description: >
      Add a new HTTP endpoint to an existing handler, including middleware
      wiring, Swagger docs, and route registration.
    instructions: |
      1. Add the handler method to `internal/<package>/handler.go`.
         - Follow the handler shape: extract auth ID → parse params → bind body
           → call service → respond.
         - Add full Swagger annotations.

      2. If a new request/response struct is needed, define it in `handler.go`
         next to the method (keep DTOs co-located with their handler).

      3. Register the route in `app/app.go > NewHTTPServer`:
         - Routes under `/:id` must be inside the subgroup that applies the
           group validation middleware.
         - Routes with `:member_id` must also chain `groupMiddleware.ValidateMemberExists()`.

      4. Add the corresponding service method to the `Service` interface and
         `serviceImpl` if the logic does not already exist.

      5. Run `swag init` from the service root to regenerate Swagger docs if
         the service uses them.
