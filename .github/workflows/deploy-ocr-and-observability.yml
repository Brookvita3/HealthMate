name: Deploy OCR and Observability

on:
  workflow_run:
    workflows: ['CI Backend']
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build OCR Service
        run: |
          docker build \
            -t brookvita3/healthmate-ocr-service:${IMAGE_TAG} \
            ./ocr-service

      - name: Push OCR Service
        run: |
          docker push brookvita3/healthmate-ocr-service:${IMAGE_TAG}

      - name: Deploy OCR VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.OCR_VPS_HOST }}
          username: root
          password: ${{ secrets.OCR_VPS_PASSWORD }}
          envs: IMAGE_TAG
          script: |
            cd ~/HealthMate/deploy

            echo "Using IMAGE_TAG=$IMAGE_TAG"

            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env

            ./deploy.sh
