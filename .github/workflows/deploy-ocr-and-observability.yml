name: Deploy OCR and Observability

on:
  workflow_run:
    workflows: ["CI Backend"]
    types:
      - completed

jobs:
  changes:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    outputs:
      ocr-service: ${{ steps.filter.outputs.ocr-service }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Detect changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ocr-service:
              - 'ocr-service/**'

  deploy:
    needs: changes
    if: needs.changes.outputs.ocr-service == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build OCR Service
        run: |
          docker build \
            -t brookvita3/healthmate-ocr-service:${IMAGE_TAG} \
            ./ocr-service

      - name: Push OCR Service
        run: |
          docker push brookvita3/healthmate-ocr-service:${IMAGE_TAG}

      - name: Deploy OCR VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.OCR_VPS_HOST }}
          username: root
          password: ${{ secrets.OCR_VPS_PASSWORD }}
          envs: IMAGE_TAG
          script: |
            cd ~/HealthMate/deploy

            echo "Using IMAGE_TAG=$IMAGE_TAG"

            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env

            ./deploy.sh
