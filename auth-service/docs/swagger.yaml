basePath: /api/v1
definitions:
  auth-service_internal_domain.Group:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      owner_id:
        type: string
      updated_at:
        type: string
    type: object
  auth-service_internal_domain.GroupInfo:
    properties:
      id:
        type: string
      member_count:
        type: integer
      name:
        type: string
    type: object
  auth-service_internal_domain.GroupMember:
    properties:
      created_at:
        type: string
      invited_by:
        type: string
      joined_at:
        type: string
      role:
        type: string
      status:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  auth-service_internal_domain.InvitationResponse:
    properties:
      group:
        $ref: '#/definitions/auth-service_internal_domain.GroupInfo'
      id:
        type: string
      invite_to:
        $ref: '#/definitions/auth-service_internal_domain.UserInfo'
      inviter:
        $ref: '#/definitions/auth-service_internal_domain.UserInfo'
      member_count:
        type: integer
      sent_at:
        type: string
      shared_metrics:
        items:
          type: string
        type: array
    type: object
  auth-service_internal_domain.MetricType:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  auth-service_internal_domain.Permission:
    properties:
      group_id:
        type: string
      metric_type:
        type: string
      user_id:
        type: string
    type: object
  auth-service_internal_domain.SentInvitationResponse:
    properties:
      created_at:
        type: string
      group_id:
        type: string
      invited_by:
        type: string
      inviter_name:
        type: string
      status:
        type: string
      user_email:
        type: string
      user_id:
        type: string
      user_name:
        type: string
    type: object
  auth-service_internal_domain.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      picture:
        description: Allows NULL
        type: string
      role:
        description: '"user"'
        type: string
      status:
        description: '"unverified", "verified"'
        type: string
      updated_at:
        type: string
    type: object
  auth-service_internal_domain.UserInfo:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  auth-service_internal_web_helpers.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  auth-service_internal_web_helpers.OKResponse:
    properties:
      message:
        type: string
    type: object
  internal_auth.EmailLoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  internal_auth.GoogleLoginRequest:
    properties:
      id_token:
        type: string
    required:
    - id_token
    type: object
  internal_auth.LoginResult:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/auth-service_internal_domain.User'
    type: object
  internal_auth.LoginSuccessResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/auth-service_internal_domain.User'
    type: object
  internal_auth.LogoutRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  internal_auth.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  internal_auth.RefreshTokenResponse:
    properties:
      access_token:
        type: string
    type: object
  internal_auth.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  internal_auth.ResendOTPRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  internal_auth.SetPasswordRequest:
    properties:
      password:
        minLength: 8
        type: string
    required:
    - password
    type: object
  internal_auth.VerifyRequest:
    properties:
      email:
        type: string
      otp:
        type: string
    required:
    - email
    - otp
    type: object
  internal_group.CreateGroupRequest:
    properties:
      description:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  internal_group.InviteMemberRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  internal_group.SetPermissionRequest:
    properties:
      enabled:
        type: boolean
      metric_type:
        type: string
    required:
    - metric_type
    type: object
  internal_group.TransferOwnershipRequest:
    properties:
      new_owner_id:
        type: string
    required:
    - new_owner_id
    type: object
  internal_group.UpdateGroupRequest:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  internal_group.UpdateMemberStatusRequest:
    properties:
      status:
        enum:
        - accepted
        - rejected
        type: string
    required:
    - status
    type: object
  internal_group.UpdatePermissionsRequest:
    properties:
      metric_types:
        items:
          type: string
        type: array
    required:
    - metric_types
    type: object
  internal_user.UpdateUserParams:
    properties:
      name:
        type: string
      picture:
        type: string
      role:
        type: string
      status:
        type: string
    type: object
host: localhost:5000
info:
  contact: {}
  description: This is the API for Auth Service of HealthMate application.
  title: HealthMate API
  version: "1.0"
paths:
  /auth/app:
    post:
      consumes:
      - application/json
      description: Authenticates a user using email and password, returns access/refresh
        tokens.
      parameters:
      - description: User Credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/internal_auth.EmailLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.LoginSuccessResponse'
      summary: Email/Password Login
      tags:
      - Auth
  /auth/google:
    post:
      consumes:
      - application/json
      description: Authenticates a user using a Google ID token and returns access/refresh
        tokens.
      parameters:
      - description: Google ID Token
        in: body
        name: token
        required: true
        schema:
          $ref: '#/definitions/internal_auth.GoogleLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.LoginSuccessResponse'
      summary: Google Login
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Logs the user out by invalidating the provided refresh token.
      parameters:
      - description: Refresh Token
        in: body
        name: token
        required: true
        schema:
          $ref: '#/definitions/internal_auth.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.OKResponse'
      security:
      - BearerAuth: []
      summary: User Logout
      tags:
      - Auth
  /auth/otp/resend:
    post:
      consumes:
      - application/json
      description: Generates and sends a new OTP to the user's email if the account
        is unverified.
      parameters:
      - description: User's Email
        in: body
        name: email_info
        required: true
        schema:
          $ref: '#/definitions/internal_auth.ResendOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Always returns a success message for security reasons
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.OKResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.ErrorResponse'
        "409":
          description: Returned if account is already verified
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.ErrorResponse'
      summary: Resend OTP
      tags:
      - Auth
  /auth/otp/verify:
    post:
      consumes:
      - application/json
      description: Verifies OTP and logs the user in by returning tokens.
      parameters:
      - description: Email and OTP
        in: body
        name: verification
        required: true
        schema:
          $ref: '#/definitions/internal_auth.VerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.LoginResult'
        "400":
          description: Invalid OTP or request
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.ErrorResponse'
        "404":
          description: OTP not found or expired
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.ErrorResponse'
      summary: Verify Account & Login
      tags:
      - Auth
  /auth/password:
    post:
      consumes:
      - application/json
      description: Sets a password for the currently authenticated user. Requires
        Bearer token.
      parameters:
      - description: New Password
        in: body
        name: password
        required: true
        schema:
          $ref: '#/definitions/internal_auth.SetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.OKResponse'
      security:
      - BearerAuth: []
      summary: Set User Password
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Provides a new access token if the given refresh token is valid.
      parameters:
      - description: Refresh Token
        in: body
        name: token
        required: true
        schema:
          $ref: '#/definitions/internal_auth.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.RefreshTokenResponse'
      security:
      - BearerAuth: []
      summary: Refresh Access Token
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new user account with email, password, and name.
      parameters:
      - description: User registration info
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/internal_auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth-service_internal_domain.User'
        "404":
          description: user not found
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.ErrorResponse'
        "409":
          description: email is already registered
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.ErrorResponse'
        "500":
          description: an unexpected error occurred
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.ErrorResponse'
      summary: Register New User
      tags:
      - Auth
  /groups:
    get:
      description: Get all groups (owned or joined) for the current user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/auth-service_internal_domain.Group'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List my groups
      tags:
      - groups
    post:
      consumes:
      - application/json
      description: Create a new group with the current user as owner
      parameters:
      - description: Group creation details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_group.CreateGroupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth-service_internal_domain.Group'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new group
      tags:
      - groups
  /groups/{id}:
    delete:
      description: Remove a group (Owner only)
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.OKResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a group
      tags:
      - groups
    get:
      description: Retrieve a group by ID
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth-service_internal_domain.Group'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a group
      tags:
      - groups
    put:
      consumes:
      - application/json
      description: Update name and description of a group
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: string
      - description: Update details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_group.UpdateGroupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.OKResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update group info
      tags:
      - groups
  /groups/{id}/invitations:
    get:
      description: List pending invitations (Owner sees all, Members see their own)
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/auth-service_internal_domain.SentInvitationResponse'
            type: array
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List group invitations which the current user is invited to
      tags:
      - groups
  /groups/{id}/members:
    get:
      description: List all members of a group (Members only)
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/auth-service_internal_domain.GroupMember'
            type: array
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get group members
      tags:
      - groups
    post:
      consumes:
      - application/json
      description: Send an invitation to a user by email
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: string
      - description: Invite details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_group.InviteMemberRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.OKResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Invite a member
      tags:
      - groups
  /groups/{id}/members/{member_id}:
    delete:
      description: Kick a member from the group (Owner only)
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: string
      - description: Member User ID
        in: path
        name: member_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.OKResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remove a member
      tags:
      - groups
  /groups/{id}/members/me:
    delete:
      description: Leave a group you are a member of
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.OKResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Leave a group
      tags:
      - groups
    put:
      consumes:
      - application/json
      description: Accept or reject a group invitation
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: string
      - description: Status update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_group.UpdateMemberStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.OKResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update membership status
      tags:
      - groups
  /groups/{id}/owner:
    put:
      consumes:
      - application/json
      description: Transfer group ownership to a new user
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: string
      - description: New owner details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_group.TransferOwnershipRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.OKResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Transfer ownership
      tags:
      - groups
  /groups/{id}/permissions:
    get:
      description: Get current user's sharing permissions in a group
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/auth-service_internal_domain.Permission'
            type: array
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get my permissions
      tags:
      - groups
    post:
      consumes:
      - application/json
      description: Enable or disable sharing for a specific metric type
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: string
      - description: Permission details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_group.SetPermissionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.OKResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Set sharing permission
      tags:
      - groups
    put:
      consumes:
      - application/json
      description: Update all sharing permissions for the current user
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: string
      - description: List of metric types
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_group.UpdatePermissionsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.OKResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update all permissions
      tags:
      - groups
  /groups/invitations:
    get:
      description: Get current user's group invitations
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/auth-service_internal_domain.InvitationResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth-service_internal_web_helpers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List group invitations of current user
      tags:
      - groups
  /groups/metric-types:
    get:
      description: Get all available health metric types that can be shared
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/auth-service_internal_domain.MetricType'
            type: array
      security:
