services:
  nginx:
    image: nginx:1.28.0
    container_name: healthmate-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-gateway
    restart: unless-stopped
    networks:
      - backend
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  api-gateway:
    image: brookvita3/healthmate-api-gateway:local
    container_name: healthmate-api-gateway
    env_file:
      - ./env/product/api-gateway.env
    environment:
      OCR_HTTP_URL: http://ocr-service:8010
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  auth-service:
    image: brookvita3/healthmate-auth-service:local
    container_name: healthmate-auth-service
    env_file:
      - ./env/product/auth-service.env
    restart: unless-stopped
    depends_on:
      storage-service:
        condition: service_started
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  realtime-service:
    image: brookvita3/healthmate-realtime-service:local
    container_name: healthmate-realtime-service
    env_file:
      - ./env/product/realtime-service.env
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_started
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  storage-service:
    image: brookvita3/healthmate-storage-service:local
    container_name: healthmate-storage-service
    env_file:
      - ./env/product/storage-service.env
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_started
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5003/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  ocr-service:
    image: brookvita3/healthmate-ocr-service:local
    container_name: healthmate-ocr-service
    env_file:
      - ./env/product/ocr-service.env
    restart: unless-stopped
    networks:
      - backend
    mem_limit: 2g
    cpus: 1.5
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8010/health"]
      interval: 60s
      timeout: 10s
      retries: 5
    logging:
      options:
        max-size: "20m"
        max-file: "5"

  prometheus:
    image: prom/prometheus:v3.6.0
    container_name: healthmate-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - backend
    restart: always

  grafana:
    image: grafana/grafana:12.1.0
    container_name: healthmate-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    networks:
      - backend
    restart: always
    depends_on:
      - prometheus

  redpanda:
    image: redpandadata/redpanda:v25.1.4
    container_name: healthmate-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    restart: unless-stopped
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  backend:
    driver: bridge

volumes:
  redpanda_data:
  prometheus_data:
  grafana_data:
