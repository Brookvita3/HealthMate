services:
  nginx:
    image: nginx:1.28.0
    container_name: DACN-nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api-gateway
      - realtime-service
      - auth-service
      - storage-service
    networks:
      - backend

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    image: brookvita3/api-gateway:local
    container_name: DACN-api-gateway
    env_file:
      - ./api-gateway/.env
    environment:
      OCR_HTTP_URL: http://ocr-service:8010
    ports:
      - "5002:5002"
    depends_on:
      - auth-service
      - realtime-service
      - storage-service
      - ocr-service
    networks:
      - backend

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    image: brookvita3/auth-service:local
    container_name: DACN-auth-service
    env_file:
      - ./auth-service/.env
    ports:
      - "5000:5000"
    networks:
      - backend
    restart: on-failure
    depends_on:
      timescaledb:
        condition: service_healthy
      storage-service:
        condition: service_started

  realtime-service:
    build:
      context: ./realtime-service
      dockerfile: Dockerfile
    image: brookvita3/realtime-service:local
    container_name: DACN-realtime-service
    env_file:
      - ./realtime-service/.env
    ports:
      - "5001:5001"
    restart: on-failure
    depends_on:
      timescaledb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - backend

  storage-service:
    build:
      context: ./storage-service
      dockerfile: Dockerfile
    image: brookvita3/storage-service:local
    container_name: DACN-storage-service
    env_file:
      - ./storage-service/.env
    ports:
      - "5003:5003"
    networks:
      - backend
    depends_on:
      timescaledb:
        condition: service_healthy
      kafka:
        condition: service_healthy

  ocr-service:
    build:
      context: ./ocr-service
      dockerfile: Dockerfile
    image: brookvita3/ocr-service:local
    container_name: DACN-ocr-service
    env_file:
      - ./ocr-service/.env
    ports:
      - "8010:8010"
    networks:
      - backend

  zookeeper:
    image: confluentinc/cp-zookeeper:7.2.15
    container_name: DACN-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - backend

  kafka:
    image: confluentinc/cp-kafka:7.2.15
    container_name: DACN-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9094:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9094,PLAINTEXT_HOST://localhost:9092
      # KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9094,PLAINTEXT_HOST://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b localhost:9092 1 10"]
      interval: 10s 
      timeout: 5s 
      retries: 5

  kafka-init:
    image: confluentinc/cp-kafka:7.2.15
    depends_on:
      - kafka
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "
      echo Waiting for Kafka...;
      sleep 5;
      kafka-topics --bootstrap-server kafka:9094 --create --topic health_metrics --partitions 1 --replication-factor 1;
      echo 'Topic healthmetric created';
      "
    networks:
      - backend

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - 8081:8080
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
    volumes:
      - ./kafka/kui/config.yml:/etc/kafkaui/dynamic_config.yaml
    depends_on:
      - kafka
    networks:
      - backend

  timescaledb:
    image: timescale/timescaledb:2.19.3-pg14
    container_name: DACN1-timescaledb
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: healthmate
    volumes:
      - timescaledbdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"] 
      interval: 6s 
      timeout: 6s
      retries: 6 

  redis:
    image: redis:8.2.0
    container_name: DACN1-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  timescaledbdata:
    driver: local
  redisdata:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_log:
    driver: local
  kafka_data:
    driver: local
