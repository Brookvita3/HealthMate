server {
    listen 8080;
    server_name localhost;

    # CORS headers trả về từ nginx để Flutter Web không bị chặn bởi browser.
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin" always;

    location /ws {
        proxy_pass http://host.docker.internal:5001;  

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_buffering off;
    }

    # Không proxy /metrics trực tiếp tới storage-service: sẽ mất CORS (Flutter Web cần header từ api-gateway).
    # Mọi /metrics/* đi qua location / → api-gateway:5002 (đã có CORSMiddleware + JWT).

    location / {
        # Trả preflight ngay ở nginx để tránh timeout upstream.
        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://host.docker.internal:5002;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # OCR có thể mất thời gian (đọc ảnh + parse), tránh 504 quá sớm.
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Tránh duplicate CORS headers từ upstream.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
    }
}
