server {
    listen 8080;
    server_name localhost;

    location /ws {
        proxy_pass http://host.docker.internal:5001;  

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_buffering off;
    }

    # Không proxy /metrics trực tiếp tới storage-service: sẽ mất CORS (Flutter Web cần header từ api-gateway).
    # Mọi /metrics/* đi qua location / → api-gateway:5002 (đã có CORSMiddleware + JWT).

    location / {
        proxy_pass http://host.docker.internal:5002;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
