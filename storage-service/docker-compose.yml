services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb-storage
    environment:
      POSTGRES_USER: healthmate
      POSTGRES_PASSWORD: healthmate123
      POSTGRES_DB: healthmate
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthmate"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  timescaledb-data:

networks:
  default:
    name: storage-service_default
