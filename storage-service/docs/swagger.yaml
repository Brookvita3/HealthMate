basePath: /
definitions:
  internal_medication.CreateMedicationRequest:
    properties:
      dosage:
        type: string
      frequency:
        items:
          type: integer
        type: array
      instructions:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      prescribed_by:
        type: string
      reminders:
        items:
          $ref: '#/definitions/internal_medication.CreateReminderInput'
        type: array
      start_date:
        type: string
      timezone:
        type: string
    required:
    - dosage
    - frequency
    - name
    - start_date
    type: object
  internal_medication.CreateReminderInput:
    properties:
      is_enabled:
        type: boolean
      time:
        type: string
    type: object
  internal_medication.Medication:
    properties:
      created_at:
        type: string
      dosage:
        type: string
      frequency:
        items:
          type: integer
        type: array
      id:
        type: string
      instructions:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      prescribed_by:
        type: string
      reminders:
        items:
          $ref: '#/definitions/internal_medication.MedicationReminder'
        type: array
      start_date:
        type: string
      timezone:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  internal_medication.MedicationReminder:
    properties:
      created_at:
        type: string
      id:
        type: string
      is_enabled:
        type: boolean
      last_taken:
        type: string
      medication_id:
        type: string
      missed_count:
        type: integer
      time:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  internal_medication.RegisterDeviceTokenRequest:
    properties:
      platform:
        type: string
      token:
        type: string
    required:
    - token
    type: object
  internal_readiness.predictRequest:
    properties:
      blood_oxygen:
        type: number
      calories_burned:
        type: number
      heart_rate:
        type: number
      sleep_duration:
        type: number
      steps:
        type: number
      stress_level:
        type: string
    required:
    - blood_oxygen
    - heart_rate
    - sleep_duration
    - stress_level
    type: object
  internal_readiness.predictResponse:
    properties:
      readiness_score:
        type: number
    type: object
  storage-service_internal_web_helpers.DataResponse:
    properties:
      data: {}
    type: object
  storage-service_internal_web_helpers.ErrorResponse:
    properties:
      error:
        type: string
    type: object
host: localhost:5003
info:
  contact: {}
  description: This is the API for Storage Service of HealthMate application.
  title: HealthMate Storage API
  version: "1.0"
paths:
  /api/v1/medications:
    get:
      consumes:
      - application/json
      description: Get a list of medications with nested reminders for the authenticated
        user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_medication.Medication'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List all medications for the user
      tags:
      - medications
    post:
      consumes:
      - application/json
      description: Add a new medication and its associated reminders for the authenticated
        user
      parameters:
      - description: Medication creation request
        in: body
        name: medication
        required: true
        schema:
          $ref: '#/definitions/internal_medication.CreateMedicationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_medication.Medication'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a new medication
      tags:
      - medications
  /api/v1/medications/{medicationId}:
    delete:
      consumes:
      - application/json
      description: Delete a specific medication and all its associated reminders by
        ID
      parameters:
      - description: Medication ID
        in: path
        name: medicationId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a medication
      tags:
      - medications
  /api/v1/medications/{medicationId}/reminders/{reminderId}/take:
    post:
      consumes:
      - application/json
      description: Toggle the 'last_taken' status of a specific reminder and return
        the updated medication list
      parameters:
      - description: Medication ID
        in: path
        name: medicationId
        required: true
        type: string
      - description: Reminder ID
        in: path
        name: reminderId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_medication.Medication'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Record medication taken
      tags:
      - medications
  /api/v1/medications/device-token:
    post:
      consumes:
      - application/json
      description: Save or update the device token for push notifications
      parameters:
      - description: Device token registration
        in: body
        name: token
        required: true
        schema:
          $ref: '#/definitions/internal_medication.RegisterDeviceTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Register a device token
      tags:
      - medications
  /metrics/charts:
    get:
      consumes:
      - application/json
      description: Get aggregated chart data for a specific metric type and user
      parameters:
      - description: User ID
        in: query
        name: user_id
        required: true
        type: string
      - description: Metric Type (e.g. heart_rate, steps)
        in: query
        name: metric_type
        required: true
        type: string
      - description: Time Range (e.g. 24h, 7d, 30d, custom)
        in: query
        name: range
        required: true
        type: string
      - description: Start Time (RFC3339) - required for custom range
        in: query
        name: start_time
        type: string
      - description: End Time (RFC3339) - required for custom range
        in: query
        name: end_time
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/storage-service_internal_web_helpers.DataResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/storage-service_internal_web_helpers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get chart data for metrics
      tags:
      - metrics
  /metrics/readiness:
    post:
      consumes:
      - application/json
      description: Predict a readiness score (0–100) from health metrics using the
        on-device ML model
      parameters:
      - description: Health metrics input
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_readiness.predictRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_readiness.predictResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/storage-service_internal_web_helpers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/storage-service_internal_web_helpers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Predict physical readiness score
      tags:
      - readiness
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
